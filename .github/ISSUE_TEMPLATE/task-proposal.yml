name: Task proposal
description: Propose a machine-verifiable observation-contract task or community extension.
title: "[Task proposal] "
body:
  - type: markdown
    attributes:
      value: |
        One task is enough to contribute. A short idea is welcome before any code is written; maintainers can help develop the verifier and reference solution. The reported 33-task suite remains the paper baseline.
  - type: input
    id: source
    attributes:
      label: Specification or documented failure
      description: Link a specification or incident if available, or briefly describe an observed failure or reproducible workflow.
      placeholder: Source URL or short description
    validations:
      required: false
  - type: textarea
    id: observation
    attributes:
      label: Observation and follow-up action
      description: What artifact or state is observed, who produces it, and which later action depends on it?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract idea
      description: What rule should the later action follow? A precise formal definition can come later. Identify a proposed new scoring dimension if validity or integrity does not apply.
    validations:
      required: true
  - type: textarea
    id: traces
    attributes:
      label: Compliant and violating traces
      description: If you have examples, give a short passing and failing trajectory. These are optional for an initial idea.
    validations:
      required: false
  - type: textarea
    id: verifier
    attributes:
      label: Deterministic verifier and reference solution
      description: If you have an idea, sketch how a local environment could verify the result and what a passing oracle would do. Maintainers can help with this.
    validations:
      required: false
  - type: textarea
    id: novelty
    attributes:
      label: Relation to existing tasks and data-use constraints
      description: If known, identify the closest task in the catalog, the difference, and any license or permission requirements.
    validations:
      required: false
